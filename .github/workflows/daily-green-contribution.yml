name: Weekly Profile Activity

on:
  schedule:
    - cron: "37 16 17 11 *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: weekly-profile-activity
  cancel-in-progress: false

jobs:
  weekly-activity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Record one transparent activity entry and schedule the next selected day
        env:
          GIT_AUTHOR_NAME: Abhishek Karande
          GIT_AUTHOR_EMAIL: 155272902+Abhishek400217@users.noreply.github.com
          GIT_COMMITTER_NAME: Abhishek Karande
          GIT_COMMITTER_EMAIL: 155272902+Abhishek400217@users.noreply.github.com
        run: |
          set -euo pipefail

          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          python3 <<'PY'
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from secrets import randbelow, sample
          from zoneinfo import ZoneInfo
          import json
          import re

          tz = ZoneInfo("Asia/Kolkata")
          now = datetime.now(tz)
          run_date = now.date()

          state_path = Path(".github/daily-activity-state.json")
          log_path = Path(".github/daily-activity.log")
          workflow_path = Path(".github/workflows/daily-green-contribution.yml")

          # On the first run, count today as day 1 and choose three more
          # distinct days from the remaining days of this same Monday-Sunday week.
          if state_path.exists():
              state = json.loads(state_path.read_text(encoding="utf-8"))
          else:
              week_start = run_date - timedelta(days=run_date.weekday())
              future_days = [
                  week_start + timedelta(days=offset)
                  for offset in range(run_date.weekday() + 1, 7)
              ]
              if len(future_days) < 3:
                  raise SystemExit("Not enough days left this week to initialize four runs.")
              selected_days = sorted([run_date] + sample(future_days, 3))
              state = {
                  "week_start": week_start.isoformat(),
                  "planned_dates": [day.isoformat() for day in selected_days],
                  "completed_dates": [],
              }

          week_start = date.fromisoformat(state["week_start"])
          planned_dates = set(state["planned_dates"])
          completed_dates = set(state["completed_dates"])
          today_text = run_date.isoformat()

          if today_text not in planned_dates:
              raise SystemExit(
                  f"Today's date {today_text} is not in the saved weekly schedule; "
                  "stopping rather than creating an unscheduled entry."
              )

          completed_dates.add(today_text)
          run_number = len(completed_dates)

          if run_number == 4:
              # Select four new, distinct days in the following Monday-Sunday week.
              next_week_start = week_start + timedelta(days=7)
              next_week_days = [
                  next_week_start + timedelta(days=offset) for offset in range(7)
              ]
              next_planned = sorted(sample(next_week_days, 4))
              next_date = next_planned[0]
              state = {
                  "week_start": next_week_start.isoformat(),
                  "planned_dates": [day.isoformat() for day in next_planned],
                  "completed_dates": [],
              }
              log_schedule_note = (
                  f"weekly target completed (4/4); next week's first planned run: "
                  f"{next_date:%Y-%m-%d}"
              )
          else:
              future_planned = sorted(
                  date.fromisoformat(day)
                  for day in planned_dates
                  if day not in completed_dates and date.fromisoformat(day) > run_date
              )
              if not future_planned:
                  raise SystemExit("No remaining planned run found for this week.")
              next_date = future_planned[0]
              state["completed_dates"] = sorted(completed_dates)
              log_schedule_note = (
                  f"weekly automated run {run_number}/4; "
                  f"next planned run: {next_date:%Y-%m-%d}"
              )

          # Randomize each selected run's time between 14:00 and 17:59 IST.
          minute_of_day = (14 * 60) + randbelow(4 * 60)
          next_hour, next_minute = divmod(minute_of_day, 60)
          next_cron = (
              f"{next_minute} {next_hour} {next_date.day} {next_date.month} *"
          )

          workflow = workflow_path.read_text(encoding="utf-8")
          updated, replacements = re.subn(
              r'(?m)^(\s*-\s*cron:\s*)["\'][^"\']+["\']\s*$',
              lambda match: f'{match.group(1)}"{next_cron}"',
              workflow,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not safely update the scheduled cron expression.")
          workflow_path.write_text(updated, encoding="utf-8")

          state_path.write_text(
              json.dumps(state, indent=2) + "\n",
              encoding="utf-8",
          )

          if not log_path.exists():
              log_path.write_text(
                  "# Automated profile activity log\n"
                  "# Entries record scheduled automation, not coding tasks.\n",
                  encoding="utf-8",
              )

          with log_path.open("a", encoding="utf-8") as log_file:
              log_file.write(
                  f"- {now:%Y-%m-%d %H:%M:%S} IST — automated profile activity; "
                  f"{log_schedule_note}; next run time randomized within "
                  "14:00–17:59 IST.\n"
              )

          print(f"Completed scheduled run {run_number}/4 for week of {week_start}.")
          print(
              f"Next run: {next_date:%Y-%m-%d} at "
              f"{next_hour:02d}:{next_minute:02d} IST"
          )
          PY

          git add .github/workflows/daily-green-contribution.yml \
                  .github/daily-activity.log \
                  .github/daily-activity-state.json

          COMMIT_DATE="$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %z')"
          GIT_AUTHOR_DATE="$COMMIT_DATE" GIT_COMMITTER_DATE="$COMMIT_DATE" \
            git commit -m "chore: record scheduled profile activity"

          git push origin "HEAD:${GITHUB_REF_NAME}"
