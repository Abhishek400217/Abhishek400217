name: Weekly Profile Activity

on:
  schedule:
    - cron: "23 14 * * 2"
      timezone: "Asia/Kolkata"
    - cron: "48 15 * * 3"
      timezone: "Asia/Kolkata"
    - cron: "07 17 * * 5"
      timezone: "Asia/Kolkata"
    - cron: "36 16 * * 0"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: weekly-profile-activity
  cancel-in-progress: false

jobs:
  weekly-activity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Record one transparent activity entry and schedule next week's days
        env:
          GIT_AUTHOR_NAME: Abhishek Karande
          GIT_AUTHOR_EMAIL: 155272902+Abhishek400217@users.noreply.github.com
          GIT_COMMITTER_NAME: Abhishek Karande
          GIT_COMMITTER_EMAIL: 155272902+Abhishek400217@users.noreply.github.com
        run: |
          set -euo pipefail

          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          python3 <<'PY'
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from secrets import randbelow, sample
          from zoneinfo import ZoneInfo
          import json
          import re

          tz = ZoneInfo("Asia/Kolkata")
          now = datetime.now(tz)
          run_date = now.date()
          current_week_start = run_date - timedelta(days=run_date.weekday())

          state_path = Path(".github/daily-activity-state.json")
          log_path = Path(".github/daily-activity.log")
          workflow_path = Path(".github/workflows/daily-green-contribution.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          def dates_from_current_week(schedule_text, monday):
              cron_values = re.findall(
                  r'(?m)^\s*-\s*cron:\s*["\']([^"\']+)["\']\s*$',
                  schedule_text,
              )
              if len(cron_values) != 4:
                  raise SystemExit("Expected exactly four weekly schedule entries.")
              selected = []
              for expression in cron_values:
                  fields = expression.split()
                  if len(fields) != 5 or fields[2] != "*" or fields[3] != "*":
                      raise SystemExit("Unexpected cron format; refusing to alter schedule.")
                  weekday = int(fields[4])
                  if weekday < 0 or weekday > 6:
                      raise SystemExit("Unexpected weekday value in cron schedule.")
                  python_weekday = (weekday + 6) % 7  # cron Sunday=0 -> Python Sunday=6
                  selected.append(monday + timedelta(days=python_weekday))
              if len(set(selected)) != 4:
                  raise SystemExit("The four schedule entries must use distinct weekdays.")
              return sorted(selected)

          if state_path.exists():
              state = json.loads(state_path.read_text(encoding="utf-8"))
              saved_week = date.fromisoformat(state["week_start"])
              if saved_week != current_week_start:
                  # Recover cleanly if a prior week's scheduled event was missed.
                  selected_days = dates_from_current_week(workflow, current_week_start)
                  state = {
                      "week_start": current_week_start.isoformat(),
                      "planned_dates": [day.isoformat() for day in selected_days],
                      "completed_dates": [],
                  }
          else:
              selected_days = dates_from_current_week(workflow, current_week_start)
              state = {
                  "week_start": current_week_start.isoformat(),
                  "planned_dates": [day.isoformat() for day in selected_days],
                  "completed_dates": [],
              }

          week_start = date.fromisoformat(state["week_start"])
          planned_dates = set(state["planned_dates"])
          completed_dates = set(state["completed_dates"])
          today_text = run_date.isoformat()

          if today_text not in planned_dates:
              raise SystemExit(
                  f"{today_text} is not one of this week's four selected days."
              )

          completed_dates.add(today_text)
          run_number = len(completed_dates)

          if run_number == 4:
              next_week_start = week_start + timedelta(days=7)
              next_week_days = [
                  next_week_start + timedelta(days=offset) for offset in range(7)
              ]
              next_planned = sorted(sample(next_week_days, 4))

              new_crons = []
              for selected_day in next_planned:
                  minute_of_day = (14 * 60) + randbelow(4 * 60)
                  hour, minute = divmod(minute_of_day, 60)
                  cron_weekday = (selected_day.weekday() + 1) % 7
                  new_crons.append(f"{minute} {hour} * * {cron_weekday}")

              replacements_iter = iter(new_crons)
              updated, replacements = re.subn(
                  r'(?m)^(\s*-\s*cron:\s*)["\'][^"\']+["\']\s*$',
                  lambda match: f'{match.group(1)}"{next(replacements_iter)}"',
                  workflow,
                  count=4,
              )
              if replacements != 4:
                  raise SystemExit("Could not safely update all four weekly schedules.")
              workflow_path.write_text(updated, encoding="utf-8")

              state = {
                  "week_start": next_week_start.isoformat(),
                  "planned_dates": [day.isoformat() for day in next_planned],
                  "completed_dates": [],
              }
              schedule_note = "weekly target completed (4/4); next week's four days randomized"
          else:
              state["completed_dates"] = sorted(completed_dates)
              schedule_note = f"weekly automated run {run_number}/4"

          state_path.write_text(
              json.dumps(state, indent=2) + "\n",
              encoding="utf-8",
          )

          if not log_path.exists():
              log_path.write_text(
                  "# Automated profile activity log\n"
                  "# Entries record scheduled automation, not coding tasks.\n",
                  encoding="utf-8",
              )

          with log_path.open("a", encoding="utf-8") as log_file:
              log_file.write(
                  f"- {now:%Y-%m-%d %H:%M:%S} IST — automated profile activity; "
                  f"{schedule_note}.\n"
              )

          print(f"Completed scheduled run {run_number}/4 for week of {week_start}.")
          PY

          git add .github/workflows/daily-green-contribution.yml \
                  .github/daily-activity.log \
                  .github/daily-activity-state.json

          COMMIT_DATE="$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %z')"
          GIT_AUTHOR_DATE="$COMMIT_DATE" GIT_COMMITTER_DATE="$COMMIT_DATE" \
            git commit -m "chore: record scheduled profile activity"

          git push origin "HEAD:${GITHUB_REF_NAME}"
